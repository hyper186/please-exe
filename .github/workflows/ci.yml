name: Verify beta
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: npm run package
      - name: Validate extension ZIP
        run: python3 -c "import zipfile; z=zipfile.ZipFile('artifacts/please-exe-0.1.0.zip'); assert z.testzip() is None; assert 'manifest.json' in z.namelist(); assert not any('.env' in n or 'server/' in n for n in z.namelist())"
